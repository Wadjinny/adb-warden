name: Build and release

# Push a tag like v0.2.0 to build the signed APK and the MCP proxy package and attach both to a GitHub release.
# "Run workflow" (manual) builds the same files as downloadable workflow artifacts without making a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      # ---------- MCP proxy ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - name: Test and package the proxy
        working-directory: proxy
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          npm ci
          npm test
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP/out"

      # ---------- Android app ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ADBWARDEN_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::Secret ADBWARDEN_KEYSTORE_BASE64 is missing; refusing to release a debug-signed APK."
              exit 1
            fi
            echo "::warning::No signing key secret; this build is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ADBWARDEN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        working-directory: android
        env:
          ADBWARDEN_KEYSTORE_PASSWORD: ${{ secrets.ADBWARDEN_KEYSTORE_PASSWORD }}
          ADBWARDEN_KEY_ALIAS: ${{ secrets.ADBWARDEN_KEY_ALIAS }}
          ADBWARDEN_KEY_PASSWORD: ${{ secrets.ADBWARDEN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode="${GITHUB_RUN_NUMBER}"
          V="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/adb-warden-$V.apk"
          # Stable name for the "latest" download link.
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/adb-warden.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Show the signing certificate
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/out/adb-warden.apk" | grep -i "sha-256"

      - uses: actions/upload-artifact@v4
        with:
          name: adb-warden-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/out/*

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          **Phone (Android 11+):** download \`adb-warden-$V.apk\` below and open it on the phone.

          **Computer (Node.js 20+ and adb):** no clone needed.

          \`\`\`sh
          # link once (code from the app: Setup → Link a computer)
          npx -y --package=https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/adb-warden-$V.tgz adb-warden link <code>

          # add it to Claude Code
          claude mcp add adb-warden -- npx -y --package=https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/adb-warden-$V.tgz adb-warden serve
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/out/* \
            --repo "$REPO" --title "ADB Warden $V" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
